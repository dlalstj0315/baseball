<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>한 획 마구왕</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
  #app{position:relative;height:100%;margin:0 auto;overflow:hidden;background:#bfe0f0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .ui{position:absolute;pointer-events:none}
  #score{top:14px;left:0;right:0;text-align:center}
  #score .big{font-size:46px;font-weight:900;color:#fff;letter-spacing:2px;line-height:1;
    -webkit-text-stroke:3px #4a7fc1;paint-order:stroke fill;text-shadow:0 3px 0 rgba(30,60,110,.35)}
  #score .small{margin-top:5px;font-size:12px;font-weight:700;color:#ff6b6b}
  .round{position:absolute;top:22px;width:38px;height:38px;border-radius:50%;background:rgba(40,48,64,.78);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;pointer-events:auto;cursor:pointer;border:0}
  #back{left:14px} #snd{right:14px}
  #msg{top:19%;left:0;right:0;text-align:center;opacity:0;transition:opacity .15s}
  #msg .t{font-size:42px;font-weight:900;color:#ff6a3d;-webkit-text-stroke:4px #fff;paint-order:stroke fill;
    text-shadow:0 4px 0 rgba(0,0,0,.18)}
  #msg .s{margin-top:4px;font-size:17px;font-weight:900;color:#fff;-webkit-text-stroke:3px #ff6a3d;paint-order:stroke fill}
  #intro{top:14%;left:0;right:0;text-align:center;font-size:30px;font-weight:900;color:#5aa7e6;
    -webkit-text-stroke:4px #fff;paint-order:stroke fill;opacity:0;transition:opacity .25s}
  #intro .s{font-size:15px;color:#fff;-webkit-text-stroke:3px #3d6fa8;margin-top:2px}
  #hint{bottom:70px;left:0;right:0;text-align:center;font-size:15px;font-weight:800;color:#fff;
    -webkit-text-stroke:3px rgba(0,0,0,.45);paint-order:stroke fill;opacity:0;transition:opacity .3s}
  #bar{left:10px;right:10px;bottom:14px;height:40px;border-radius:20px;background:rgba(28,34,48,.86);
    display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff;font-size:12px;font-weight:800;white-space:nowrap}
  #bar .grp{display:flex;align-items:center;gap:3px}
  #bar .d{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22)}
  #bar .d.b{background:#4cd964} #bar .d.s{background:#ffcc00} #bar .d.o{background:#ff5a4a}
  #bar .sp{flex:1}
  #bases{width:26px;height:20px;position:relative}
  #bases i{position:absolute;width:8px;height:8px;transform:rotate(45deg);background:rgba(255,255,255,.25)}
  #bases i.on{background:#ffcc00}
  #menu{position:absolute;inset:0;background:rgba(13,22,48,.93);display:flex;flex-direction:column;align-items:center;
    justify-content:safe center;gap:9px;color:#fff;pointer-events:auto;padding:20px;overflow-y:auto}
  #menu h1{margin:0 0 2px;font-size:40px;font-weight:900;color:#fff;-webkit-text-stroke:5px #e8453c;paint-order:stroke fill;
    letter-spacing:1px;line-height:1.1;text-align:center}
  #menu .tag{font-size:13px;color:#cfd8ea;margin-bottom:8px;text-align:center}
  #menu .lbl{font-size:12px;color:#aeb9d1;margin-top:6px}
  #menu .row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  #menu button.opt{border:2px solid rgba(255,255,255,.75);background:transparent;color:#fff;border-radius:18px;
    padding:6px 13px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  #menu button.opt.on{background:#fff;color:#14204a}
  #play{margin-top:16px;background:#e8453c;color:#fff;border:0;border-radius:24px;padding:12px 44px;font-size:20px;
    font-weight:900;box-shadow:0 4px 0 #9b231c;cursor:pointer;font-family:inherit}
  #steal{position:absolute;right:12px;bottom:64px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
  #steal button{border:0;border-radius:18px;background:#ffcc00;color:#1b2340;font-weight:900;font-size:14px;padding:9px 16px;
    box-shadow:0 3px 0 #b38f00;font-family:inherit;cursor:pointer}
  #lobby{position:absolute;inset:0;z-index:5;background:rgba(13,22,48,.96);display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;color:#fff;pointer-events:auto;padding:24px;text-align:center}
  #lobby h2{margin:0;font-size:30px;font-weight:900;-webkit-text-stroke:4px #e8453c;paint-order:stroke fill}
  #lobby .big{font-size:44px;font-weight:900;letter-spacing:8px;color:#ffd84d;min-height:52px}
  #lobby input{font-size:24px;font-weight:900;text-align:center;letter-spacing:6px;width:190px;padding:8px;border-radius:12px;border:0;
    text-transform:uppercase;font-family:inherit}
  #lobby button{border:0;border-radius:22px;padding:10px 26px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
  #lobby .pri{background:#e8453c;color:#fff;box-shadow:0 3px 0 #9b231c} #lobby .sec{background:#fff;color:#14204a}
  #lobby .msg{font-size:14px;color:#cfd8ea;white-space:pre-line;min-height:40px}
  #vs{margin-top:8px;background:#3d6fe0;color:#fff;border:0;border-radius:20px;padding:9px 30px;font-size:16px;font-weight:900;
    box-shadow:0 3px 0 #2346a0;cursor:pointer;font-family:inherit}
  #runPanel{position:absolute;right:10px;bottom:62px;display:none;flex-direction:column;gap:5px;pointer-events:auto;z-index:3}
  #runPanel .row{display:flex;gap:5px;align-items:center;justify-content:flex-end}
  #runPanel .nm{font-size:12px;font-weight:900;color:#fff;-webkit-text-stroke:2.5px rgba(0,0,0,.55);paint-order:stroke fill;min-width:52px;text-align:right}
  #runPanel button{border:0;border-radius:14px;font-weight:900;font-size:13px;padding:7px 11px;font-family:inherit;cursor:pointer}
  #runPanel .bk{background:#fff;color:#1b2340;box-shadow:0 2px 0 #9aa4b8} #runPanel .ad{background:#ffcc00;color:#1b2340;box-shadow:0 2px 0 #b38f00}
  #runPanel .all button{font-size:14px;padding:9px 14px}
  #varBtn{position:absolute;left:12px;bottom:64px;display:none;border:0;border-radius:18px;background:#e8453c;color:#fff;
    font-weight:900;font-size:14px;padding:9px 16px;box-shadow:0 3px 0 #9b231c;font-family:inherit;cursor:pointer;pointer-events:auto;z-index:3}
  #toast{top:46%;left:20px;right:20px;text-align:center;font-size:20px;font-weight:900;color:#fff;
    -webkit-text-stroke:3px rgba(10,20,40,.7);paint-order:stroke fill;opacity:0;transition:opacity .25s}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="score" class="ui"><div class="big" id="sc">0 - 0</div><div class="small" id="scs">나 - 상대</div></div>
  <button class="round" id="back" title="메뉴">◀</button>
  <button class="round" id="snd" title="소리">🔊</button>
  <div id="intro" class="ui"></div>
  <div id="msg" class="ui"><div class="t" id="mt"></div><div class="s" id="ms"></div></div>
  <div id="toast" class="ui"></div>
  <div id="hint" class="ui"></div>
  <div id="bar" class="ui">
    <span id="inn">1회초</span>
    <span class="grp">B <span id="bB"></span></span>
    <span class="grp">S <span id="bS"></span></span>
    <span class="grp">O <span id="bO"></span></span>
    <span id="bases"><i style="left:9px;top:0"></i><i style="left:17px;top:7px"></i><i style="left:1px;top:7px"></i></span>
    <span class="sp"></span>
    <span id="pc">0구</span><span id="kmh" style="color:#ffd84d"></span>
  </div>
  <div id="steal"></div>
  <button id="varBtn">VAR 판독 요청</button>
  <div id="runPanel"></div>
  <div id="lobby">
    <h2>1vs1 온라인</h2>
    <div class="msg">방을 만들고 코드를 친구에게 알려주세요.<br>방장이 홈팀(말 공격), 참가자가 원정팀(초 공격)이에요.</div>
    <button class="pri" id="mk">방 만들기</button>
    <div class="big" id="codeBig"></div>
    <div style="display:flex;gap:8px;align-items:center"><input id="codeIn" maxlength="6" placeholder="코드"><button class="sec" id="jn">참가</button></div>
    <div class="msg" id="lobbyMsg"></div>
    <button class="sec" id="lbClose">닫기</button>
  </div>
  <div id="menu">
    <h1>한 획<br>마구왕</h1>
    <div class="tag">그린 대로 휜다. 같은 마구는 두 번 안 통한다.</div>
    <div class="lbl">게임 모드</div>
    <div class="row" data-k="game"><button class="opt" data-v="normal">정식</button><button class="opt" data-v="orig">오리지널</button><button class="opt" data-v="bm">병맛</button></div>
    <div class="tag" id="gameDesc" style="margin:2px 0 0;min-height:16px"></div>
    <div class="lbl">플레이</div>
    <div class="row" data-k="mode"><button class="opt" data-v="pitch">투수만</button><button class="opt" data-v="bat">타자만</button><button class="opt" data-v="both">둘 다</button></div>
    <div class="lbl">피칭 난이도 (상대 타자)</div>
    <div class="row" data-k="pLv"></div>
    <div class="lbl">배팅 난이도 (상대 투수)</div>
    <div class="row" data-k="bLv"></div>
    <div class="lbl">타격 방식</div>
    <div class="row" data-k="hit"><button class="opt" data-v="center">중심 맞춰 치기</button><button class="opt" data-v="tap">탭</button></div>
    <div class="lbl">이닝</div>
    <div class="row" data-k="inn"><button class="opt" data-v="1">1회</button><button class="opt" data-v="3">3회</button><button class="opt" data-v="6">6회</button><button class="opt" data-v="9">9회</button></div>
    <button id="play">플레이볼</button>
    <button id="vs">1vs1 온라인</button>
  </div>
</div>
<script>
"use strict";
// ======================================================================
//  설정
// ======================================================================
const S = {game:'normal', mode:'both', pLv:3, bLv:3, hit:'center', inn:3, sound:true};
try { Object.assign(S, JSON.parse(localStorage.getItem('magu-settings') || '{}')); } catch(e) {}
const saveS = () => { try { localStorage.setItem('magu-settings', JSON.stringify(S)); } catch(e) {} };

const $ = id => document.getElementById(id);
const app = $('app'), cv = $('c'), ctx = cv.getContext('2d');
let W = 400, H = 800, CX = 200, CY = 400, LOWQ = false, frameEma = 16, lastFrameT = 0;
function resize(){
  const w = Math.min(innerWidth, Math.round(innerHeight * 0.62));
  app.style.width = w + 'px';
  W = w; H = innerHeight; CX = W/2; CY = H*0.5;
  const dpr = LOWQ ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// ======================================================================
//  수학 / 카메라
// ======================================================================
const V = (x,y,z) => ({x,y,z});
const add = (a,b) => V(a.x+b.x,a.y+b.y,a.z+b.z), sub = (a,b) => V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul = (a,s) => V(a.x*s,a.y*s,a.z*s), dot = (a,b) => a.x*b.x+a.y*b.y+a.z*b.z;
const cross = (a,b) => V(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);
const len3 = a => Math.hypot(a.x,a.y,a.z), norm = a => mul(a, 1/(len3(a)||1));
const lerp = (a,b,k) => a+(b-a)*k, lerp3 = (a,b,k) => add(a, mul(sub(b,a),k));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = k => k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
const rnd = (a,b) => a + Math.random()*(b-a);
const gauss = () => Math.sqrt(-2*Math.log(Math.random()||1e-9))*Math.cos(2*Math.PI*Math.random());
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

let CAM;
function makeCam(pos, target, fov){
  const fwd = norm(sub(target,pos)), right = norm(cross(V(0,1,0), fwd)), up = cross(fwd, right);
  return {pos, target, fov, fwd, right, up, f:(H/2)/Math.tan(fov*Math.PI/360)};
}
const NEAR = 0.12;
const toCam = (p, c=CAM) => { const d = sub(p, c.pos); return V(dot(d,c.right), dot(d,c.up), dot(d,c.fwd)); };
const proj = (q, c=CAM) => ({x:CX + c.f*q.x/q.z, y:CY - c.f*q.y/q.z});
function P3(p, c=CAM){ const q = toCam(p,c); if (q.z < NEAR) return null; const s = proj(q,c); s.z = q.z; return s; }
function unproject(c, sx, sy, zt){
  const dir = add(add(mul(c.right,(sx-CX)/c.f), mul(c.up,-(sy-CY)/c.f)), c.fwd);
  return add(c.pos, mul(dir, (zt - c.pos.z)/dir.z));
}
function clipPoly(cs){
  const out = [];
  for (let i=0;i<cs.length;i++){
    const a = cs[i], b = cs[(i+1)%cs.length], ai = a.z>=NEAR, bi = b.z>=NEAR;
    if (ai) out.push(a);
    if (ai!==bi){ const k=(NEAR-a.z)/(b.z-a.z); out.push(V(a.x+(b.x-a.x)*k, a.y+(b.y-a.y)*k, NEAR)); }
  }
  return out;
}
function poly(pts, fill){
  const cs = clipPoly(pts.map(p => toCam(p))); if (cs.length<3) return;
  ctx.beginPath(); cs.forEach((q,i)=>{ const s=proj(q); i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y); });
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function line3(a, b, color, w){
  let qa = toCam(a), qb = toCam(b);
  if (qa.z<NEAR && qb.z<NEAR) return;
  if (qa.z<NEAR){ const k=(NEAR-qa.z)/(qb.z-qa.z); qa=V(qa.x+(qb.x-qa.x)*k, qa.y+(qb.y-qa.y)*k, NEAR); }
  else if (qb.z<NEAR){ const k=(NEAR-qb.z)/(qa.z-qb.z); qb=V(qb.x+(qa.x-qb.x)*k, qb.y+(qa.y-qb.y)*k, NEAR); }
  const sa=proj(qa), sb=proj(qb);
  ctx.strokeStyle=color; ctx.lineWidth=Math.max(1, w*CAM.f/((qa.z+qb.z)/2)); ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(sa.x,sa.y); ctx.lineTo(sb.x,sb.y); ctx.stroke();
}
const circ = (cx,cz,r,n,y=0) => Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2; return V(cx+Math.cos(a)*r,y,cz+Math.sin(a)*r);});

// ======================================================================
//  로우폴리 메쉬 (면 단위 정렬 + 평면 셰이딩)
// ======================================================================
const LIGHT = norm(V(0.35, 0.9, 0.15));
let FACES = [];
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function addFace(pts, n, rgb, cull=true){
  let c = V(0,0,0); for (const p of pts) c = add(c,p); c = mul(c, 1/pts.length);
  if (cull && dot(n, sub(CAM.pos, c)) <= 0) return;
  const cs = clipPoly(pts.map(p=>toCam(p))); if (cs.length<3) return;
  let z = 0; for (const q of cs) z += q.z; z /= cs.length;
  const b = 0.6 + 0.4*Math.max(0, dot(n, LIGHT));
  FACES.push({z, s:cs.map(q=>proj(q)), col:`rgb(${rgb[0]*b|0},${rgb[1]*b|0},${rgb[2]*b|0})`});
}
function addBox(c, ax, ay, az, col){
  const rgb = hex(col);
  for (const [A,B,C] of [[ax,ay,az],[ay,az,ax],[az,ax,ay]]){
    for (const sgn of [1,-1]){
      const f = add(c, mul(A,sgn));
      addFace([sub(sub(f,B),C), add(sub(f,C),B), add(add(f,B),C), sub(add(f,C),B)], norm(mul(A,sgn)), rgb);
    }
  }
}
function perp(d){ const a = Math.abs(d.y) < 0.9 ? V(0,1,0) : V(1,0,0); const u = norm(cross(d,a)); return [u, cross(d,u)]; }
function addCyl(a, b, r, col, n=8, r2){
  const rgb = hex(col), d = norm(sub(b,a)), [u,v] = perp(d), rb = r2 ?? r;
  const ring = (c, rr) => Array.from({length:n},(_,i)=>{ const t=i/n*Math.PI*2; return add(c, add(mul(u,Math.cos(t)*rr), mul(v,Math.sin(t)*rr))); });
  const A = ring(a, r), B = ring(b, rb);
  for (let i=0;i<n;i++){
    const j=(i+1)%n, t=(i+0.5)/n*Math.PI*2;
    addFace([A[i],A[j],B[j],B[i]], norm(add(mul(u,Math.cos(t)), mul(v,Math.sin(t)))), rgb);
  }
  addFace(A.slice().reverse(), mul(d,-1), rgb); addFace(B, d, rgb);
}
function addSphere(c, r, col, lat=5, lon=10, sy=1){
  const rgb = hex(col);
  const P = (i,j) => { const th=i/lat*Math.PI, ph=j/lon*Math.PI*2;
    return add(c, V(Math.sin(th)*Math.cos(ph)*r, Math.cos(th)*r*sy, Math.sin(th)*Math.sin(ph)*r)); };
  for (let i=0;i<lat;i++) for (let j=0;j<lon;j++){
    const pts = [P(i,j), P(i,j+1), P(i+1,j+1), P(i+1,j)];
    const th=(i+.5)/lat*Math.PI, ph=(j+.5)/lon*Math.PI*2;
    addFace(pts, V(Math.sin(th)*Math.cos(ph), Math.cos(th), Math.sin(th)*Math.sin(ph)), rgb);
  }
}
function addCustom(p, fn){ const q = toCam(p); if (q.z < NEAR) return; FACES.push({z:q.z, fn}); }
function flushFaces(){
  FACES.sort((a,b)=>b.z-a.z);
  for (const f of FACES){
    if (f.fn){ f.fn(); continue; }
    ctx.beginPath(); f.s.forEach((s,i)=> i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y)); ctx.closePath();
    ctx.fillStyle = f.col; ctx.fill(); ctx.strokeStyle = f.col; ctx.lineWidth = 0.6; ctx.stroke();
  }
  FACES = [];
}

// ======================================================================
//  경기장
// ======================================================================
const fenceR = th => { const a = Math.abs(th);
  if (a <= Math.PI/4) return 92 + 12*Math.cos(2*th);
  return lerp(92, 19, Math.sqrt((a-Math.PI/4)/(Math.PI*3/4))); };
const FENCE = Array.from({length:73}, (_,i) => { const th = -Math.PI + i/72*Math.PI*2, r = fenceR(th); return V(Math.sin(th)*r, 0, Math.cos(th)*r); });
const STAND_DOTS = [], DOTS_BY_SEG = Array.from({length:72}, () => []);
for (let i=0;i<72;i++) for (let k=0;k<10;k++){
  const th = -Math.PI + (i+Math.random())/72*Math.PI*2, r = fenceR(th), v = Math.random();
  STAND_DOTS.push({seg:i, p:V(Math.sin(th)*(r+2+20*v), 3.6+13*v, Math.cos(th)*(r+2+20*v)),
                   c:`hsl(${Math.random()*360|0},35%,${62+Math.random()*20|0}%)`});
}
for (const d of STAND_DOTS) DOTS_BY_SEG[d.seg].push(d);

function drawField(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#9fd0ea'); g.addColorStop(0.55,'#d6ecf4'); g.addColorStop(1,'#e8f4f2');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  poly([V(-400,0,-300),V(400,0,-300),V(400,0,400),V(-400,0,400)], '#7fc069');
  if (!LOWQ) for (let i=0;i<16;i++){ const z = 8 + i*7; if (i%2) continue;
    poly([V(-120,0,z),V(120,0,z),V(120,0,z+3.5),V(-120,0,z+3.5)], '#88c873'); }
  // 내야 흙
  const arc = []; for (let i=0;i<=18;i++){ const a = -0.82 + i/18*1.64; arc.push(V(Math.sin(a)*28.5, 0, 18.44 + Math.cos(a)*28.5)); }
  poly([V(0,0,-4.5), V(21,0,14.5), ...arc, V(-21,0,14.5)], '#d9ad7c');
  poly([V(0,0,3.6), V(15.6,0,19.4), V(0,0,35.2), V(-15.6,0,19.4)], '#7fc069');
  poly(circ(0,18.44,2.75,20), '#d9ad7c');
  poly(circ(0,0,4.2,24), '#d9ad7c');
  // 라인
  const wl = 'rgba(255,255,255,.95)';

let AC = null;
function audio(){ if (!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state==='suspended') AC.resume(); return AC; }
function noise(dur, type, freq, vol, q=1){
  if (!S.sound) return; const ac = audio(); if (!ac) return;
  const n = Math.floor(ac.sampleRate*dur), buf = ac.createBuffer(1,n,ac.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n, 2.5);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
}
function tone(freq, dur, vol, type='sine'){
  if (!S.sound) return; const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}

// 결과 처리 ---------------------------------------------------------
function advance(kind){
  const b = G.bases; let runs = 0;
  if (kind === 'hr'){ runs = b[0]+b[1]+b[2]+1; G.bases = [0,0,0]; }
  else if (kind === 'double'){ runs = b[2]+b[1]; G.bases = [0,1,b[0]]; }
  else if (kind === 'single'){ runs = b[2]; G.bases = [1,b[0],b[1]]; }
  else if (kind === 'walk'){
    if (b[0]&&b[1]&&b[2]) runs = 1;
    G.bases = [1, b[0]?1:b[1], (b[0]&&b[1])?1:b[2]];
  }
  if (G.half === 'top') G.opp += runs; else G.me += runs;
  return runs;
}
// res: 'ball','strike','foul','out','single','double','hr'
function applyResult(res){
  let paOver = false, k = '';
  if (res === 'ball'){ G.balls++; if (G.balls >= 4){ advance('walk'); paOver = true; k = 'walk'; } }
  else if (res === 'hbp'){ advance('walk'); paOver = true; k = 'hbp'; }
  else if (res === 'strike'){ G.strikes++; if (G.strikes >= 3){ G.outs++; paOver = true; k = 'k'; } }
  else if (res === 'foul'){ if (G.strikes < 2) G.strikes++; }
  else if (res === 'out'){ G.outs++; paOver = true; }
  else { advance(res); paOver = true; }
  return {paOver, k};
}
function afterResult(paOver, delay){
  G.nextAt = now() + delay;
  G.after = () => {
    if (!paOver) return nextPitch();
    if (G.half === 'top') G.oppSlot++; else G.meSlot++;
    if (G.half === 'bot' && G.inning >= S.inn && G.me > G.opp) return endGame();
    if (G.outs >= 3) return endHalf();
    newPA();
  };
}
function endHalf(){
  if (G.half === 'top'){
    if (G.inning >= S.inn && G.me > G.opp) return endGame();
    G.half = 'bot';
  } else {
    if (G.inning >= S.inn) return endGame();
    G.inning++; G.half = 'top';
  }
  showToast('공수 교대'); setPhase('change'); G.nextAt = now() + 1300; G.after = startHalf;
}
function simHalf(){
  const top = G.half === 'top';
  const lv = top ? S.pLv : S.bLv;
  let runs = 0, outs = 0, bases = [0,0,0];
  while (outs < 3){
    const r = Math.random(), hrP = 0.02 + lv*0.008, hitP = 0.2 + lv*0.012;
    if (r < hrP){ runs += bases.reduce((a,b)=>a+b,0)+1; bases=[0,0,0]; }
    else if (r < hrP + hitP){ runs += bases[2]; bases = [1,bases[0],bases[1]]; }
    else if (r < hrP + hitP + 0.07){ if (bases[0]&&bases[1]&&bases[2]) runs++; bases = [1, bases[0]?1:bases[1], (bases[0]&&bases[1])?1:bases[2]]; }
    else outs++;
    if (!top && G.inning >= S.inn && G.me + runs > G.opp) break;
  }
  if (top){ G.opp += runs; G.oppSlot += 4; } else { G.me += runs; G.meSlot += 4; }
  showToast(`${top ? '상대' : '우리'} 공격 · ${runs}점`);
  setPhase('sim'); G.nextAt = now() + 1600;
  G.after = () => { if (!top && G.inning >= S.inn && G.me > G.opp) return endGame(); G.outs = 3; endHalf(); };
}
const myRuns = () => NET.role === 'guest' ? G.opp : G.me, oppRuns = () => NET.role === 'guest' ? G.me : G.opp;

  showMsg(t, `${my} - ${op} · 탭해서 메뉴로`, 0);

}

const ORIG_LINEUP = [['리틀야구 꼬마',1,.85], ['동네야구 아저씨',1,1.0], ['야구부 신입생',2,.95], ['조기축구 회장',2,1.05],

const origBest = () => { try { return +localStorage.getItem('magu-orig-best') || 0; } catch(e){ return 0; } };
function origResolve(pc){
  const r = pc.res, O = G.orig;
  if (['hr','foul','single','double','out'].includes(r)){ SFX.crack(); G.fly = makeFly(r, pc.end.w, Math.random()<.5?-1:1); }
  else if (r === 'hbp'){ SFX.pop(); tone(180, 0.12, 0.4); }
  else { G.mitt = V(clamp(pc.end.w.x,-1,1), clamp(pc.end.w.y,.2,1.8), -.45); SFX.pop(); }
  let cleared = false, lost = false, title = '';
  if (r === 'foul'){ if (G.strikes < 2) G.strikes++; title = '파울!'; }
  else if (r === 'strike' || r === 'miss'){ G.strikes++; title = r === 'miss' ? '헛스윙!' : '스트라이크!';
    if (G.strikes >= 3){ cleared = true; title = r === 'miss' ? '헛스윙 삼진!' : '루킹 삼진!'; } }
  else if (r === 'ball'){ G.balls++; title = '볼'; if (G.balls >= 4){ lost = true; title = '볼넷...'; } }
  else if (r === 'hbp'){ lost = true; title = '데드볼...'; }
  else if (r === 'out'){ cleared = true; title = (G.fly && G.fly.label) || '아웃!'; }
  else { lost = true; title = {single:'안타...', double:'2루타...', hr:'홈런...'}[r]; }
  const tag = pc.read ? '읽혔다! 같은 마구는 안 통한다' : (pc.swing && pc.d > pc.r*2 ? '허를 찔렀다!' : '');
  const kind = pc.angle < 30 ? `직구 ${pc.angle}°` : `마구 ${pc.angle}°`;
  let sub = [tag, `${kind} · ${pc.kmh}km/h`].filter(Boolean).join(' · ');
  if (cleared){ O.stage++; G.oppSlot++; sub = `${O.stage}명째 격파! · ` + sub; }
  if (lost){ O.lives--; sub = `남은 목숨 ${O.lives} · ` + sub; }
  const delay = G.fly ? G.fly.dur*1000 + 500 : 1300, showAt = G.fly ? Math.min(1200, G.fly.dur*600) : 0;
  setTimeout(() => showMsg(title, sub, Math.max(900, delay - showAt), cleared ? '#ffb21e' : undefined), showAt);
  if (cleared) setTimeout(SFX.cheer, 200);
  G.nextAt = now() + delay;
  G.after = () => {
    if (O.stage >= ORIG_LINEUP.length) return origEnd(true);
    if (O.lives <= 0) return origEnd(false);
    if (cleared || lost) newPA(); else nextPitch();
  };
  hint(''); setPhase('p_after');
}
function origEnd(win){
  const O = G.orig, best = Math.max(origBest(), O.stage);
  try { localStorage.setItem('magu-orig-best', best); } catch(e){}
  setPhase('end');
  showMsg(win ? '마구왕 등극!' : '강판...', `${O.stage}명 격파 · 최고 기록 ${best}명 · 탭해서 메뉴로`, 0, win ? '#ffb21e' : undefined);
  if (win){ SFX.cheer(); confetti(120); }
}

// ======================================================================
//  투구 (내가 투수) — 그린 선이 그대로 화면 궤적
// ======================================================================
const pitchCam = () => makeCam(V(0, 2.55, 30.5), V(0, 0.95, 0), 12.5);
const batCam   = () => makeCam(V(-0.3, 1.55, -3.7), V(0.02, 1.28, 18.44), 46);

function zoneRect(c){
  const a = P3(V(-ZONE.w, ZONE.t, 0), c), b = P3(V(ZONE.w, ZONE.b, 0), c);
  return {x1:Math.min(a.x,b.x), x2:Math.max(a.x,b.x), y1:Math.min(a.y,b.y), y2:Math.max(a.y,b.y)};
}
function sAt(path, t){
  if (t <= path[0].t) return path[0];
  for (let i=1;i<path.length;i++){
    if (path[i].t >= t){ const a=path[i-1], b=path[i], d=b.t-a.t, k=d<=0?1:(t-a.t)/d;
      return {x:a.x+(b.x-a.x)*k, y:a.y+(b.y-a.y)*k, w:lerp3(a.w,b.w,k), t}; }
  }
  return path[path.length-1];
}
function turnAngle(pts){
  const rs = [pts[0]];
  for (const p of pts){ const l = rs[rs.length-1]; if (Math.hypot(p.x-l.x,p.y-l.y) >= 12) rs.push(p); }
  let sum = 0;
  for (let i=2;i<rs.length;i++){
    const a1 = Math.atan2(rs[i-1].y-rs[i-2].y, rs[i-1].x-rs[i-2].x), a2 = Math.atan2(rs[i].y-rs[i-1].y, rs[i].x-rs[i-1].x);
    let d = a2-a1; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
    sum += Math.abs(d);
  }
  return Math.round(sum*180/Math.PI);
}
function signature(path, T, Zw){
  const a = path[0], e = path[path.length-1], sig = [];
  for (let i=1;i<12;i++){ const t = T*i/12, p = sAt(path,t), lx = lerp(a.x,e.x,i/12), ly = lerp(a.y,e.y,i/12);
    sig.push((p.x-lx)/Zw, (p.y-ly)/Zw); }
  return {sig, T, ex:e.x/Zw, ey:e.y/Zw};
}
function sigDist(a, b){
  let s = 0; for (let i=0;i<a.sig.length;i++) s += Math.abs(a.sig[i]-b.sig[i]);
  return s/a.sig.length*2 + Math.abs(a.T-b.T)*0.8 + Math.hypot(a.ex-b.ex, a.ey-b.ey)*0.35;
}

function throwPitch(){
  const pts = G.stroke.pts; G.stroke.done = now();
  let L = 0; for (let i=1;i<pts.length;i++) L += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
  if (pts.length < 4 || L < 70){ showToast('조금 더 길게 그어주세요'); G.stroke = null; if (G.aiSteal) G.aiSteal.t = 0; setPhase('p_aim'); return; }
  const c = pitchCam(), zr = zoneRect(c), Zw = zr.x2 - zr.x1;
  const raw = Math.max((pts[pts.length-1].t - pts[0].t)/1000, 0.05);
  let T = clamp(raw*1.3 + 0.12, 0.38, 2.8);
  if (NET.role) T = Math.max(T*NET_SLOW, 0.5);
  const path = pts.map(p => {
    const u = clamp((p.t - pts[0].t)/1000/raw, 0, 1), z = RELEASE.z*(1-u);
    const w = unproject(c, p.x, p.y, z); w.y = Math.max(w.y, 0.05);
    return {x:p.x, y:p.y, t:u*T, w};
  });
  const kmh = Math.round(18.44/T*3.6);
  const angle = turnAngle(pts);
  const end = path[path.length-1];
  const inZ = (x,y,m) => x > zr.x1 - m*Zw && x < zr.x2 + m*Zw && y > zr.y1 - m*Zw && y < zr.y2 + m*Zw;
  const strike = inZ(end.x, end.y, 0.06);
  if (NET.role){
    const step = Math.max(1, Math.ceil(path.length/50));
    const send = path.filter((p,i) => i % step === 0 || i === path.length-1).map(p => [+p.t.toFixed(3), +p.w.x.toFixed(3), +p.w.y.toFixed(3), +p.w.z.toFixed(3)]);
    netSend({t:'pitch', path:send, T, kmh, angle});
    G.pitches++; G.kmh = kmh;
    G.pitch = {path, T, t0:now(), swing:false, res:null, end, read:false, angle, kmh, side:'pitch', net:true};
    setPhase('p_fly'); SFX.throw(); hint(''); return;
  }

  // 타자 AI
  const lvNow = G.orig ? ORIG_LINEUP[G.orig.stage][1] : S.pLv, base = BAT_LV[lvNow];
  const slotK = G.orig ? ORIG_LINEUP[G.orig.stage][2] : (BM() ? BM_NAMES : OPP_LINEUP)[G.oppSlot % 9][1];
  const sig = signature(path, T, Zw);
  const read = G.memory.some(m => sigDist(m, sig) < 0.22);
  let px, py;
  const commit = Math.max(Math.min(base.read*T, T - base.swing), 0.05);
  const p0 = sAt(path, commit);
  if (read){
    px = end.x + gauss()*base.noise*0.35*Zw; py = end.y + gauss()*base.noise*0.35*Zw;
  } else {
    const dt = Math.max(0.05*T, 0.03);
    const p1 = sAt(path, Math.max(commit-dt,0)), p2 = sAt(path, Math.max(commit-2*dt,0));
    const vx=(p0.x-p1.x)/dt, vy=(p0.y-p1.y)/dt, ax=(p0.x-2*p1.x+p2.x)/(dt*dt), ay=(p0.y-2*p1.y+p2.y)/(dt*dt);
    const rem = T - commit;
    px = p0.x + vx*rem + 0.5*ax*rem*rem*base.acc + gauss()*base.noise*Zw;
    py = p0.y + vy*rem + 0.5*ay*rem*rem*base.acc + gauss()*base.noise*Zw;
  }
  // 마지막 순간 눈으로 따라가며 예측을 보정 (레벨이 높을수록 많이)
  if (!read){ const track = [0, .35, .42, .48, .52, .55][lvNow]; px = lerp(px, end.x, track); py = lerp(py, end.y, track); }
  let swing = inZ(px, py, 0.25);
  if (!swing && inZ(px, py, 0.7) && Math.random() < base.chase*(read?1.5:1)) swing = true;
  if (!swing && G.strikes === 2 && inZ(px, py, 0.4)) swing = true;
  const hb = bodyHit(path), call = callPitch(end.w), hbp = !!hb;
  if (hbp) swing = false;
  let res = swing ? 'miss' : hbp ? 'hbp' : (call.called ? 'strike' : 'ball'), d = 0, r = 1;
  if (swing){
    d = Math.hypot(px-end.x, py-end.y);
    r = base.radius*slotK*Zw*clamp((T - base.minT)/0.35, 0.3, 1)*(read ? 1.3 : 1);
    const k = d/r;
    res = k < .14 ? 'hr' : k < .3 ? 'double' : k < .52 ? 'single' : k < .8 ? 'out' : k < 1 ? 'foul' : 'miss';
  }
  G.memory.push(sig); if (G.memory.length > 14) G.memory.shift();
  G.pitches++; G.kmh = kmh;
  G.pitch = {path, T, t0:now(), swing, res, end, read, angle, kmh, d, r, side:'pitch', call, hbp:hb};
  setPhase('p_fly'); SFX.throw(); hint('');
}

// ======================================================================
//  타격 (내가 타자) — 상대 투수 공 생성
// ======================================================================
function genPitch(){
  const lv = PIT_LV[S.bLv];
  let type = pick(lv.types);
  if (Math.random() < lv.magu + (BM() ? 0.4 : 0)) type = '마구';
  let kmh = rnd(lv.kmh[0], lv.kmh[1])*0.88;
  let bx = 0, by = 0, p = 2.4;
  const bk = lv.breakK;
  if (type === '직구'){ bx = rnd(-.05,.05); by = rnd(.0,.08); }
  if (type === '커브'){ kmh *= .78; bx = rnd(.1,.25)*bk; by = -rnd(.55,.85)*bk; p = 2.0; }
  if (type === '슬라이더'){ kmh *= .87; bx = rnd(.3,.5)*bk; by = -rnd(.1,.2)*bk; p = 2.8; }
  if (type === '체인지업'){ kmh *= .8; bx = -rnd(.05,.15); by = -rnd(.2,.35)*bk; }
  if (type === '포크'){ kmh *= .86; by = -rnd(.45,.7)*bk; p = 3.4; }
  const strike = Math.random() < 0.6;
  let tx, ty;
  if (strike){ tx = rnd(-ZONE.w*.85, ZONE.w*.85); ty = rnd(ZONE.b+.05, ZONE.t-.05); }
  else { const sideK = Math.random();
    if (sideK < .5){ tx = Math.random() < .5 ? -rnd(ZONE.w+.06, 0.55) : rnd(ZONE.w+.08, ZONE.w+.35); ty = rnd(ZONE.b, ZONE.t); }
    else { tx = rnd(-ZONE.w, ZONE.w); ty = Math.random()<.6 ? rnd(.1, ZONE.b-.08) : rnd(ZONE.t+.08, ZONE.t+.35); } }
  if (Math.random() < 0.025){ tx = rnd(-0.95, -0.68); ty = rnd(0.6, 1.4); }
  const wig = type === '마구' ? {ax:rnd(.25,.5)*(Math.random()<.5?-1:1), ay:rnd(.15,.4), f:rnd(1.5,3)} : null;
  if (wig && BM()){ wig.ax *= 1.7; wig.ay *= 1.5; }
  if (wig) kmh = rnd(lv.kmh[0]*.7, lv.kmh[1]*1.05);
  const T = 18.44/(kmh/3.6);
  const path = [];
  for (let i=0;i<=60;i++){
    const u = i/60, t = u*T;
    const bf = Math.pow(u, p);
    let x = lerp(RELEASE.x, tx-bx, u) + bx*bf, y = lerp(RELEASE.y, ty-by, u) + by*bf;
    if (wig){ const s = Math.sin(u*Math.PI*2*wig.f)*Math.sin(u*Math.PI); x += wig.ax*s; y += wig.ay*Math.cos(u*Math.PI*wig.f*1.3)*Math.sin(u*Math.PI); }
    path.push({t, w:V(x, Math.max(.05,y), RELEASE.z*(1-u))});
  }
  return {path, T, type, kmh:Math.round(kmh), end:path[path.length-1].w};
}
function wAt(path, t){
  if (t <= path[0].t) return path[0].w;
  for (let i=1;i<path.length;i++) if (path[i].t >= t){ const a=path[i-1], b=path[i], k=(t-a.t)/((b.t-a.t)||1); return lerp3(a.w,b.w,k); }
  return path[path.length-1].w;
}
function startOppPitch(){
  const pp = genPitch();
  G.pitch = {...pp, t0:now(), side:'bat', swing:false, res:null, windup:0.75, hbp:bodyHit(pp.path)};
  G.pitches++; G.kmh = '';
  if (G.steal && !G.steal.t) G.steal.t = now();
  setPhase('b_fly');
}
function playerSwing(sx, sy){
  const pc = G.pitch; if (!pc || pc.swing || PHASE !== 'b_fly') return;
  const t = (now() - pc.t0)/1000 - pc.windup;
  if (t < 0.15) return;
  pc.swing = true; pc.swingT = t; SFX.swing();
  const c = batCam(), zr = zoneRect(c), Zw = zr.x2 - zr.x1;
  const e = t - pc.T;
  const end = pc.end, inZ = Math.abs(end.x) < ZONE.w+.12 && end.y > ZONE.b-.12 && end.y < ZONE.t+.12;
  let q;
  if (S.hit === 'tap'){
    q = 1 - Math.abs(e)/0.11; if (!inZ) q *= 0.35;
    G.tap = null;
  } else {
    const bp = P3(wAt(pc.path, clamp(t, 0, pc.T)), c);
    const dd = bp ? Math.hypot(sx-bp.x, sy-bp.y)/Zw : 9;
    q = (1 - dd/0.55) * (1 - Math.abs(e)/0.18);
    if (e < -0.18 || e > 0.06) q = -1;
    G.tap = {x:sx, y:sy, t:now()};
  }
  let res;
  if (q <= 0) res = 'miss';
  else if (q < .22) res = 'foul';
  else if (q < .45) res = Math.random() < .25 ? 'foul' : 'out';
  else if (q < .64) res = 'single';
  else if (q < .8) res = Math.random() < .6 ? 'double' : 'single';
  else res = Math.random() < .7 ? 'hr' : 'double';
  pc.res = res; pc.e = e;
}

// 타구 비행 --------------------------------------------------------------
function makeFly(res, start, pullSign){
  let spd, el, az, label = '';
  if (res === 'hr'){ spd = rnd(44,50); el = rnd(.45,.6); az = rnd(.05,.6)*pullSign; if (BM()){ spd *= 1.6; el = rnd(.95,1.2); } }
  else if (res === 'double'){ spd = rnd(36,42); el = rnd(.22,.34); az = rnd(.4,.72)*pullSign; }
  else if (res === 'single'){ spd = rnd(30,36); el = rnd(.05,.2); az = rnd(-.5,.5); }
  else if (res === 'foul'){ spd = rnd(22,32); el = rnd(.3,1.1); az = (Math.random()<.5?-1:1)*rnd(.9,2.4); }
  else { // out
    if (Math.random() < .55){ spd = rnd(22,28); el = rnd(-.2,-.05); az = rnd(-.6,.6); label = '땅볼 아웃!'; }
    else { spd = rnd(26,32); el = rnd(.8,1.15); az = rnd(-.6,.6); label = '뜬공 아웃!'; }
  }
  let vel = V(Math.sin(az)*Math.cos(el)*spd, Math.sin(el)*spd, Math.cos(az)*Math.cos(el)*spd);
  let pos = V(start.x, Math.max(start.y,.3), .35); const pts = [];
  for (let i=0;i<300;i++){

// 타자 몸(우타자, 기본 자세)을 캡슐로: [시작, 끝, 반지름]
function batterCapsules(){
  const X = -0.92, hk = HK(), hands = V(X+0.3, 1.32, -0.2), hy = 1.51 + 0.15*hk;
  return [
    [V(X,0.02,0.32), V(X,0.82,0.08), 0.1], [V(X,0.02,-0.3), V(X,0.82,-0.08), 0.1],      // 다리
    [V(X,0.86,0), V(X+0.02,1.36,0), 0.22],                                              // 몸통
    [V(X+0.06,1.36,0.14), hands, 0.065], [V(X+0.06,1.36,-0.14), hands, 0.065],          // 팔
    [V(X+0.03,hy,0), V(X+0.03,hy,0), 0.15*hk],                                          // 머리(헬멧)
  ];
}
const segDist = (p, a, b) => { const ab = sub(b,a), t = clamp(dot(sub(p,a),ab)/(dot(ab,ab) || 1), 0, 1); return len3(sub(p, add(a, mul(ab,t)))); };
// 공 궤적({t, w} 배열)이 몸에 실제로 닿는지. 닿으면 {w: 맞은 지점, t: 시각}
function bodyHit(path){
  const caps = batterCapsules(), R = 0.037, pts = path.map(p => ({t:p.t, w:p.w}));
  const a = pts[pts.length-2], b = pts[pts.length-1];
  if (a && b){ const d = sub(b.w, a.w), L = len3(d) || 1, dt = (b.t - a.t) || 0.01;     // 포수 쪽으로 조금 연장
    for (let s = 0.1; s <= 0.7; s += 0.1) pts.push({t: b.t + dt*s/L, w: add(b.w, mul(d, s/L))}); }
  for (let i = 1; i < pts.length; i++){
    const p0 = pts[i-1], p1 = pts[i]; if (Math.min(p0.w.z, p1.w.z) > 1.0) continue;
    const n = Math.max(1, Math.ceil(len3(sub(p1.w, p0.w))/0.03));
    for (let j = 0; j <= n; j++){ const u = j/n, w = lerp3(p0.w, p1.w, u);
      for (const [c0, c1, r] of caps) if (segDist(w, c0, c1) < r + R) return {w, t: lerp(p0.t, p1.t, u)}; }
  }
  return null;
}

    let t = o.call.real ? '스트라이크' : '볼';
    if (k === 'k') t = '삼진'; if (k === 'walk') t = '볼넷';
    showMsg('판정 번복! ' + t, 'VAR 기회는 그대로', 1500, '#4cd964');
    afterResult(paOver, 1600);
  } else {
    const P = o.P, r = o.lc.runner;
    if (o.lc.realOut){ outRunner(P, r, o.lc.arr, o.lc.tag ? 'tag' : 'force', o.lc.tb); }
    else { r.out = false; r.pos = r.target*BASE_LEN; P.events = P.events.filter(e => e.out !== o.lc.tb); P.outLog = P.outLog.filter(e => e.r !== r); }
    applyPlayOutcome(P, playOutcome(P), o.batting, '판정 번복! ');
    afterResult(P.paOver, 1600);
  }
  setPhase(v.prev);
}
function varPanel(lines, color){
  $('msg').style.opacity = 0;
  const w = W - 40, h = 26 + lines.length*22, x = 20, y = 182;
  ctx.fillStyle = 'rgba(12,20,40,.82)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 12) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.strokeStyle = color || '#5aa7e6'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  lines.forEach((l, i) => { ctx.font = i === 0 ? '900 16px sans-serif' : '700 13px sans-serif'; ctx.fillText(l, W/2, y + 24 + i*22); });
}
function renderVAR(t){
  const o = G.var.o, k = (t - G.var.t0)/1000;
  if (o.kind === 'pitch'){
    // 포수 시점 정면: 존을 크게, 공이 날아와서 박히는 지점
    CAM = makeCam(V(0, 0.85, -2.6), V(0, 0.83, 3), 38);
    drawField();
    drawBatter(0, BM() && G.bmUni ? G.bmUni : iBat() ? COL.meUni : COL.oppUni);
    const e = o.end, travel = clamp(k/1.1, 0, 1), bz = lerp(17, 0, travel);
    flushFaces();
    { const s = P3(V(e.x, e.y, bz)); if (s){ const r = Math.max(2, 0.037*CAM.f/s.z);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#e0503c'; ctx.lineWidth = Math.max(1, r*.12); ctx.beginPath(); ctx.arc(s.x-r*.95, s.y, r*.7, -.8, .8); ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x+r*.95, s.y, r*.7, Math.PI-.8, Math.PI+.8); ctx.stroke(); } }
    const corner = (x, y) => P3(V(x, y, 0));
    const c = [corner(-ZONE.w,ZONE.b), corner(ZONE.w,ZONE.b), corner(ZONE.w,ZONE.t), corner(-ZONE.w,ZONE.t)];
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); c.forEach((s,i)=> i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y)); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
    for (let i=1;i<3;i++){
      const a = corner(lerp(-ZONE.w, ZONE.w, i/3), ZONE.b), b = corner(lerp(-ZONE.w, ZONE.w, i/3), ZONE.t);
      const a2 = corner(-ZONE.w, lerp(ZONE.b, ZONE.t, i/3)), b2 = corner(ZONE.w, lerp(ZONE.b, ZONE.t, i/3));
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.moveTo(a2.x,a2.y); ctx.lineTo(b2.x,b2.y); ctx.stroke(); }
    // 공 궤적 점
    for (let u = 0; u < travel; u += 0.08){ const s = P3(V(e.x, e.y, lerp(17, 0, u))); if (!s) continue;
      ctx.fillStyle = 'rgba(255,96,38,.75)'; ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI*2); ctx.fill(); }
    if (travel >= 1){
      const s = P3(V(e.x, e.y, 0)), r = 0.037*CAM.f/s.z;   // 공 반지름 약 3.7cm
      ctx.strokeStyle = `rgba(255,216,77,${0.6+0.4*Math.sin(t/120)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(s.x, s.y, r + 6, 0, Math.PI*2); ctx.stroke();
      if (k > 1.6){
        const out = Math.max(Math.abs(e.x) - ZONE.w, ZONE.b - e.y, e.y - ZONE.t), cm = Math.round(Math.abs(out - 0.03)*100);
        const inside = out < 0.03;
        varPanel(['ABS 판독 결과', inside ? `존 안쪽 ${cm}cm · 스트라이크` : `존 바깥 ${cm}cm · 볼`, `심판 판정: ${o.call.called ? '스트라이크' : '볼'}`], inside ? '#4cd964' : '#ff8a3d');
      }
    }
  } else {
    // 베이스 옆 높은 곳에서: 베이스 · 달려오는 주자 · 날아오는 공
    const lc = o.lc, b = BASES[lc.tb], bat = o.batting;
    const prevB = (lc.dir > 0 && lc.tb < 4) ? BASES[lc.tb + 1] : BASES[Math.max(0, lc.tb - 1)];
    const dB = norm(sub(b, prevB)); let nB = V(dB.z, 0, -dB.x);
    if (dot(nB, sub(b, V(0,0,19.4))) < 0) nB = mul(nB, -1);
    CAM = makeCam(add(b, add(add(mul(dB, 5.5), mul(nB, 0.7)), V(0, 2.6, 0))), add(b, add(mul(dB, -5), V(0, 0.5, 0))), 52);
    drawField();
    const slow = 0.45, tau = lc.arr - 1.3 + Math.min(1.5, k*slow);
    const rp = lc.tb*BASE_LEN + (lc.dir > 0 ? 1 : -1)*lc.spd*Math.max(0, lc.rArr - tau);
    const [ru, rc] = bat ? TEAM.me : TEAM.opp, [fu, fc] = bat ? TEAM.opp : TEAM.me;
    drawRunner(add(b, add(mul(nB, -0.45), mul(dB, 0.3))), mul(dB, -1), fu, fc, false, 1, 0);
    const runPos = clamp(rp, lc.tb*BASE_LEN - 16, lc.tb*BASE_LEN + 16);
    drawRunner(runnerPos({pos:runPos}), dB, ru, rc, tau < lc.rArr, 1, runPos);
    const tb_ = lc.ball;
    if (tb_ && tau < tb_.t0 + tb_.td + 0.05){
      const kk = clamp((tau - tb_.t0)/tb_.td, 0, 1), h = Math.min(6, tb_.dist*.06);
      const bq = (u) => { const q = lerp3(tb_.from, tb_.to, u); return V(q.x, q.y + 4*h*u*(1-u), q.z); };
      drawBall(bq(kk)); flushFaces();
      for (let u = Math.max(0, kk - 0.25); u < kk; u += 0.04){ const s = P3(bq(u)); if (s){ ctx.fillStyle = 'rgba(255,96,38,.7)'; ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI*2); ctx.fill(); } }
    } else {
      // 수비수 글러브 속 공 (태그하러 내미는 중)
      const gp = lc.hold || b, rpp = runnerPos({pos:runPos}), tg = clamp((tau - (lc.arr - 0.3))/0.3, 0, 1);
      drawBall(add(lerp3(V(gp.x, 0, gp.z), rpp, tg*0.6), V(0, 0.9, 0))); flushFaces();
    }
    const bs = P3(V(b.x, 0.05, b.z));
    if (bs){ ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(bs.x, bs.y, 22, 9, 0, 0, Math.PI*2); ctx.stroke();
      ctx.font = '900 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(BASE_NAME[lc.tb], bs.x, bs.y + 26); }
    ctx.font = '900 13px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(`SLOW ×${slow}`, 16, 100);
    if (k > 2.0){
      const dtv = lc.rArr - lc.arr, ballFirst = dtv > 0;
      const who = ballFirst ? (lc.tag ? '수비' : '공') : '주자';
      varPanel([`${BASE_NAME[lc.tb]} 판독 결과`, `${who}가 ${Math.max(0.01, Math.abs(dtv)).toFixed(2)}초 먼저`, `심판 판정: ${lc.callOut ? '아웃' : '세이프'}`], ballFirst ? '#4cd964' : '#ff8a3d');
    }
  }
  if (Math.floor(t/450) % 2){ ctx.fillStyle = '#e8453c'; ctx.beginPath(); ctx.arc(W-26, 82, 7, 0, Math.PI*2); ctx.fill();
    ctx.font = '900 12px sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText('VAR', W-38, 86); }
}

// ======================================================================
//  단계별 진행
// ======================================================================
const aiStealDist = () => clamp(3 + Math.max(0,(now()-G.aiSteal.t)/1000 - G.aiSteal.react)*STEAL_SPD, 0, BASE_LEN);
const netStealDist = () => clamp(4 + Math.max(0,(now()-(G.netSteal.t||now()))/1000 - G.netSteal.react)*STEAL_SPD, 0, BASE_LEN);
function step(t){
  if (!G || PHASE === 'menu') return;
  updateStealUI(); updateVarUI(); updateRunPanel();
  if (PHASE === 'var'){ if (now() - G.var.t0 > 3600) finishVAR(); return; }
  netPump();
  if (G.play) return updatePlay(t);
  const pc = G.pitch;
  if (PHASE === 'p_fly'){
    const el = (t - pc.t0)/1000;
    if (el >= pc.T){
      if (pc.net && !pc.res){ setPhase('p_wait'); hint('상대 타자 결과 기다리는 중...'); return; }
      resolveMyPitch(pc, null);
    }
  } else if (PHASE === 'b_wait'){
    if (t - PT > 1300) startOppPitch();
  } else if (PHASE === 'b_fly'){
    const el = (t - pc.t0)/1000 - pc.windup;
    if (pc.swing && pc.res && pc.res !== 'miss' && el >= Math.max(pc.swingT, pc.T - 0.02)) finishBat(pc.res);
    else if (el >= pc.T + 0.12){
      SFX.pop();
      if (pc.swing) finishBat('miss');
      else if (pc.hbp) finishBat('hbp');
      else { pc.call = callPitch(pc.end); finishBat(pc.call.called ? 'strike' : 'ball'); }
    }
  } else if (G.after && G.nextAt && t >= G.nextAt){
    const f = G.after; G.after = null; G.nextAt = 0; f();
  } else if (G.after && G.nextAt === 0){
    const f = G.after; G.after = null; f();
  }
}
function applyNetResult(m){
  const pc = G.pitch; if (!pc) return;
  pc.res = m.res; pc.swing = m.swing;
  resolveMyPitch(pc, m);
}
// 내가 던진 공의 결과 처리 (AI 타자 또는 온라인 상대)
function resolveMyPitch(pc, m){
  if (G.orig) return origResolve(pc);
  const r = pc.res;
  if (['double','single','out'].includes(r)){
    SFX.crack(); hint('');
    if (m){ startPlay({kind:'hit', res:r, start:V(m.start[0],m.start[1],m.start[2]), seed:m.seed, defCtrl:'me', runCtrl:'remote', paOver:true,
                      stealer: G.netSteal ? {from:G.netSteal.from, dist:netStealDist()} : null}); G.play.netSync = true; }
    else startPlay({kind:'hit', res:r, start:pc.end.w, seed:Math.random()*1e9|0, defCtrl:'me', runCtrl:'ai',
                    stealer: G.aiSteal && G.aiSteal.t ? {from:G.aiSteal.from, dist:aiStealDist()} : null, paOver:true});
    return;
  }
  if (r === 'hr' || r === 'foul'){ SFX.crack(); G.fly = makeFly(r, pc.end.w, Math.random()<.5?-1:1); }
  else if (r === 'hbp'){ SFX.pop(); tone(180, 0.12, 0.4); }
  else { G.mitt = V(clamp(pc.end.w.x,-1,1), clamp(pc.end.w.y,.2,1.8), -.45); SFX.pop(); }
  const snap = snapG();
  const {paOver, k} = applyResult(r === 'miss' ? 'strike' : r);
  const tag = pc.read ? '읽혔다! 같은 마구는 안 통한다' : (pc.swing && pc.d > pc.r*2 ? '허를 찔렀다!' : '');
  const kind = pc.angle < 30 ? `직구 ${pc.angle}°` : `마구 ${pc.angle}°`;
  const sub = r === 'hbp' ? `몸에 맞는 볼 · ${pc.kmh}km/h` : [tag, `${kind} · ${pc.kmh}km/h`].filter(Boolean).join(' · ');
  const T = {hr:'홈런...', foul:'파울!', miss:'헛스윙!', strike:'스트라이크!', ball:'볼', hbp:'데드볼...'};
  let title = T[r];
  if (k === 'k') title = r === 'strike' ? '루킹 삼진!' : '헛스윙 삼진!';
  if (k === 'walk') title = '볼넷...';
  const delay = G.fly ? G.fly.dur*1000 + 500 : 1300;
  const showAt = G.fly ? Math.min(1200, G.fly.dur*600) : 0;
  setTimeout(() => showMsg(title, sub, Math.max(900, delay - showAt), r==='hr'?'#ffb21e':undefined), showAt);
  if (r === 'hr') setTimeout(SFX.cheer, 300);
  hint('');
  if (!m && G.aiSteal && G.aiSteal.t && r !== 'foul' && r !== 'hr' && k !== 'walk' && r !== 'hbp' && G.outs < 3){
    const st = {from:G.aiSteal.from, dist:aiStealDist()}; G.aiSteal = null;
    startPlay({kind:'steal', defCtrl:'me', runCtrl:'ai', stealer:st, seed:Math.random()*1e9|0, paOver});
    return;
  }
  if (m && G.netSteal && r !== 'foul' && r !== 'hr' && k !== 'walk' && r !== 'hbp' && G.outs < 3){
    const st = {from:G.netSteal.from, dist:netStealDist()}; G.netSteal = null;
    startPlay({kind:'steal', defCtrl:'me', runCtrl:'remote', stealer:st, seed:Math.random()*1e9|0, paOver}); G.play.netSync = true;
    return;
  }
  if (!m && !pc.swing && r === 'ball' && pc.call && pc.call.near) offerVAR({kind:'pitch', call:pc.call, end:pc.end.w, snap});
  afterResult(paOver, delay + (G.varOffer ? 1800 : 0));
  setPhase('p_after');
}
function finishBat(r){
  const pc = G.pitch; G.kmh = pc.kmh;
  const inPlay = ['double','single','out'].includes(r);
  const st = G.steal && G.steal.t ? {from:G.steal.from, dist:stealerDist(G.steal)} : null;
  if (pc.net){
    if (inPlay){
      const seed = Math.random()*1e9|0, start = pc.end;
      netSend({t:'result', res:r, swing:pc.swing, seed, start:[start.x,start.y,start.z]});
      SFX.crack();
      startRemotePlay(start);
      return;
    }
    netSend({t:'result', res:r, swing:pc.swing});
  } else if (inPlay){
    SFX.crack();
    startPlay({kind:'hit', res:r, start:pc.end, seed:Math.random()*1e9|0, defCtrl:'ai', runCtrl:'me', stealer:st, paOver:true});
    return;
  }
  if (r === 'hr' || r === 'foul'){ SFX.crack(); G.fly = makeFly(r, pc.end, (pc.e||0) < 0 ? -1 : 1); }
  const snap = snapG();
  const {paOver, k} = applyResult(r === 'miss' ? 'strike' : r);
  const T = {hr:'홈런!!', foul:'파울', miss:'헛스윙...', strike:'스트라이크', ball:'볼', hbp:'데드볼!'};
  let title = T[r];
  if (k === 'k') title = '삼진...'; if (k === 'walk') title = '볼넷!';
  const timing = pc.swing && pc.e !== undefined ? (pc.e < -0.05 ? '빨랐다' : pc.e > 0.03 ? '늦었다' : '타이밍 좋음') : '';
  const sub = r === 'hbp' ? '몸에 맞는 볼 · 1루로' : [`${pc.type} · ${pc.kmh}km/h`, timing].filter(Boolean).join(' · ');
  if (r === 'hbp') tone(180, 0.12, 0.4);
  const delay = G.fly ? G.fly.dur*1000 + 500 : 1300;
  const showAt = G.fly ? Math.min(1100, G.fly.dur*550) : 0;
  const good = r === 'hr' || k === 'walk' || k === 'hbp';
  setTimeout(() => showMsg(title, sub, Math.max(900, delay - showAt), r==='hr' ? '#ffb21e' : good ? '#ff8a1e' : undefined), showAt);
  if (r === 'hr') setTimeout(SFX.cheer, 300);
  if (!pc.net && st && r !== 'foul' && r !== 'hr' && k !== 'walk' && r !== 'hbp' && G.outs < 3){
    G.steal = null;
    startPlay({kind:'steal', defCtrl:'ai', runCtrl:'ai', stealer:st, seed:Math.random()*1e9|0, paOver});
    return;
  }
  if (pc.net && G.steal && r !== 'foul' && r !== 'hr' && k !== 'walk' && r !== 'hbp' && G.outs < 3){ G.pendingPaOver = paOver; startRemoteSteal(); return; }
  if (!pc.net && !pc.swing && r === 'strike' && pc.call && pc.call.near) offerVAR({kind:'pitch', call:pc.call, end:pc.end, snap});
  afterResult(paOver, delay + (G.varOffer ? 1800 : 0));
  setPhase('b_after');
}

requestAnimationFrame(frame);
</script>
